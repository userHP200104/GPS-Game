<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equilibrium</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%23ff7eb3%22/><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22none%22 stroke=%22%23ec4899%22 stroke-width=%224%22 opacity=%220.5%22/></svg>">
    <!-- Dynamic Manifest Link for PWA -->
    <link id="manifest-link" rel="manifest" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 2026 Minimalist Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600&display=swap');
        
        :root {
            --bg-color: #050507;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-glow-2: rgba(236, 72, 153, 0.3);
            --glow-intense: rgba(236, 72, 153, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            overflow: hidden;
            touch-action: none;
        }

        .ambient-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 150vw;
            height: 150vw;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle at 30% 30%, var(--accent-glow), transparent 40%),
                        radial-gradient(circle at 70% 70%, var(--accent-glow-2), transparent 40%);
            filter: blur(80px);
            opacity: 0.6;
            z-index: -1;
            animation: pulse 10s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            100% { transform: translate(-50%, -50%) rotate(10deg) scale(1.1); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        #game-board {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
        }

        .safe-zone {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: absolute;
        }
        
        .center-target {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: absolute;
        }

        #particle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px #6366f1;
            transition: box-shadow 0.3s ease, background 0.3s ease;
            z-index: 10;
        }

        /* Center Glow Effect */
        #particle.centered {
            background: #ff7eb3;
            box-shadow: 0 0 30px #ff7eb3, 0 0 60px #ec4899, 0 0 90px var(--glow-intense);
        }

        .multiplier-glow {
            text-shadow: 0 0 15px #ec4899;
            color: #ff7eb3 !important;
        }

        /* Explosion Particles */
        .shrapnel {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff7eb3;
            border-radius: 50%;
            box-shadow: 0 0 10px #ec4899;
            transition: transform 1s cubic-bezier(0.1, 0.8, 0.2, 1), opacity 1s ease-out;
            opacity: 1;
        }

        .tracking-widest-xl { letter-spacing: 0.2em; }
        
        button { transition: all 0.2s ease; }
        button:active { transform: scale(0.95); }
        
        input {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-align: center;
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            outline: none;
            border-radius: 12px;
            transition: border-color 0.3s ease;
        }
        input:focus { border-color: #ff7eb3; }
        input::placeholder { color: rgba(255,255,255,0.2); }

        #countdown {
            font-size: 8rem;
            font-weight: 200;
            text-shadow: 0 0 40px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen relative">
    
    <div class="ambient-bg"></div>

    <!-- START SCREEN -->
    <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center glass-panel m-6 p-8 text-center transition-opacity duration-500">
        <h1 class="text-4xl font-light tracking-widest-xl mb-2">EQUILIBRIUM</h1>
        <p class="text-indigo-300 text-xs tracking-widest uppercase mb-6">v3.0 Local</p>
        <p class="text-sm text-gray-400 mb-8 max-w-xs font-light">
            Keep the core balanced. Hold it in the exact center to double your multiplier. Walk to increase baseline multiplier.
        </p>
        <button id="start-btn" class="px-8 py-4 bg-white text-black rounded-full font-semibold tracking-wide hover:bg-gray-200 shadow-[0_0_20px_rgba(255,255,255,0.3)]">
            INITIALIZE SENSORS
        </button>
        
        <!-- Local Highscore Display -->
        <div class="mt-12 glass-panel p-4 w-full max-w-xs">
            <p class="text-xs text-gray-500 uppercase tracking-widest mb-2">Local Best</p>
            <div class="flex justify-between items-center px-2">
                <span id="local-best-name" class="font-semibold text-gray-300 tracking-widest">---</span>
                <span id="local-best-score" class="font-semibold text-indigo-400">0</span>
            </div>
        </div>
    </div>

    <!-- COUNTDOWN SCREEN -->
    <div id="countdown-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center m-6 p-8 hidden">
        <div id="countdown">3</div>
        <p class="text-gray-400 tracking-widest-xl mt-4 uppercase text-sm">Prepare to Balance</p>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center glass-panel m-6 p-6 text-center hidden">
        <h2 class="text-3xl font-light text-red-400 tracking-widest-xl mb-1">CONTAINMENT LOST</h2>
        
        <div class="glass-panel p-6 mt-6 mb-6 w-full max-w-xs">
            <p class="text-sm text-gray-400 uppercase tracking-wider mb-1">Final Score</p>
            <p id="final-score" class="text-4xl font-semibold mb-4">0</p>
            
            <div id="highscore-entry" class="hidden flex flex-col items-center">
                <p class="text-xs text-[#ff7eb3] uppercase tracking-widest mb-2">New Personal Best!</p>
                <input type="text" id="player-name" maxlength="3" placeholder="AAA" class="w-24 py-2 uppercase mb-3" oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '')">
                <button id="save-score-btn" class="px-6 py-2 bg-indigo-600/50 hover:bg-indigo-500 text-white rounded-full text-sm font-semibold tracking-wide w-full border border-indigo-400/50">
                    SAVE TO DEVICE
                </button>
            </div>
            <p id="score-saved-msg" class="text-xs text-green-400 hidden mt-4">Score Saved.</p>
        </div>

        <button id="restart-btn" class="px-8 py-4 bg-white/10 border border-white/20 text-white rounded-full font-semibold tracking-wide hover:bg-white/20">
            RECALIBRATE
        </button>
    </div>

    <!-- MAIN GAME UI -->
    <div id="game-ui" class="flex-1 flex flex-col p-6 hidden opacity-0 transition-opacity duration-1000">
        <!-- Header / Stats -->
        <header class="flex justify-between items-center mb-8">
            <div class="glass-panel px-4 py-2 flex flex-col">
                <span class="text-[10px] text-gray-500 uppercase tracking-wider">Score</span>
                <span id="ui-score" class="text-xl font-semibold transition-colors duration-300">0</span>
            </div>
            <div class="glass-panel px-4 py-2 flex flex-col items-end">
                <span class="text-[10px] text-gray-500 uppercase tracking-wider">Multiplier</span>
                <span id="ui-multiplier" class="text-xl font-semibold text-indigo-400 transition-all duration-300">x1.0</span>
            </div>
        </header>

        <!-- Play Area -->
        <div class="flex-1 flex items-center justify-center relative">
            <div id="game-board">
                <div class="safe-zone"></div>
                <div class="center-target"></div>
                <div id="particle"></div>
            </div>
        </div>

        <!-- Telemetry Data -->
        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="glass-panel p-4 flex flex-col justify-center">
                <span class="text-[10px] text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                    Distance
                </span>
                <div class="flex items-end gap-1">
                    <span id="ui-distance" class="text-2xl font-semibold">0.0</span>
                    <span class="text-gray-400 text-sm mb-0.5">m</span>
                </div>
            </div>
            
            <div class="glass-panel p-4 flex flex-col justify-center">
                <span class="text-[10px] text-gray-500 uppercase tracking-wider mb-1 flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Time
                </span>
                <div class="flex items-end gap-1">
                    <span id="ui-time" class="text-2xl font-semibold">0</span>
                    <span class="text-gray-400 text-sm mb-0.5">s</span>
                </div>
            </div>
        </div>
    </div>

    <!-- PWA Setup Script -->
    <script>
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#050507"/><circle cx="256" cy="256" r="150" stroke="#6366f1" stroke-width="20" fill="none"/><circle cx="256" cy="256" r="40" fill="#fff"/></svg>`;
        const manifestBlob = new Blob([JSON.stringify({
            name: "Equilibrium", short_name: "Equil", start_url: "./", display: "standalone",
            background_color: "#050507", theme_color: "#050507",
            icons: [{ src: 'data:image/svg+xml;base64,' + btoa(iconSvg), sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        })], { type: 'application/json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        const swCode = `self.addEventListener('install', e => e.waitUntil(caches.open('eq-v3').then(c => c.addAll(['./'])))); self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));`;
        if ('serviceWorker' in navigator) navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' })));
    </script>

    <!-- Main Game Logic -->
    <script>
        // Local Storage Handling
        let localBestData = { name: '---', score: 0 };
        const LS_KEY = 'equilibrium_highscore';

        function loadHighscore() {
            const saved = localStorage.getItem(LS_KEY);
            if (saved) {
                try {
                    localBestData = JSON.parse(saved);
                    document.getElementById('local-best-name').innerText = localBestData.name;
                    document.getElementById('local-best-score').innerText = localBestData.score.toLocaleString();
                } catch(e) {
                    console.error("Could not parse highscore", e);
                }
            }
        }
        
        // Initial Load
        loadHighscore();

        // DOM Elements
        const DOM = {
            startScreen: document.getElementById('start-screen'),
            countdownScreen: document.getElementById('countdown-screen'),
            countdownText: document.getElementById('countdown'),
            gameOverScreen: document.getElementById('game-over-screen'),
            gameUI: document.getElementById('game-ui'),
            startBtn: document.getElementById('start-btn'),
            restartBtn: document.getElementById('restart-btn'),
            saveBtn: document.getElementById('save-score-btn'),
            particle: document.getElementById('particle'),
            board: document.getElementById('game-board'),
            uiScore: document.getElementById('ui-score'),
            uiMultiplier: document.getElementById('ui-multiplier'),
            uiDistance: document.getElementById('ui-distance'),
            uiTime: document.getElementById('ui-time'),
            finalScore: document.getElementById('final-score'),
            hsEntry: document.getElementById('highscore-entry'),
            playerName: document.getElementById('player-name'),
            savedMsg: document.getElementById('score-saved-msg')
        };

        let state = {
            isPlaying: false, score: 0, baseMultiplier: 1.0, currentMultiplier: 1.0,
            distanceWalked: 0, timeElapsed: 0, startTime: 0,
            x: 0, y: 0, vx: 0, vy: 0,
            startLat: null, startLon: null, geoWatchId: null, animFrame: null,
            shrapnelElements: []
        };

        const config = { boardRadius: 140, particleRadius: 12, maxRadius: 128, centerRadius: 15 };

        // Math & Logic Helpers
        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3, p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        };

        const handleOrientation = (e) => {
            if (!state.isPlaying) return;
            let x = Math.max(-90, Math.min(90, e.gamma || 0));
            let y = Math.max(-90, Math.min(90, e.beta || 0));
            
            // Apply velocity
            state.vx += x * 0.05;
            state.vy += y * 0.05;
            
            // Friction
            state.vx *= 0.94;
            state.vy *= 0.94;
        };

        const handlePosition = (pos) => {
            if (!state.isPlaying) return;
            const lat = pos.coords.latitude, lon = pos.coords.longitude;
            if (state.startLat === null) { state.startLat = lat; state.startLon = lon; } 
            else {
                const dist = calculateDistance(state.startLat, state.startLon, lat, lon);
                if (dist > state.distanceWalked) {
                    state.distanceWalked = dist;
                    state.baseMultiplier = 1.0 + (state.distanceWalked * 0.1);
                    DOM.uiDistance.innerText = state.distanceWalked.toFixed(1);
                }
            }
        };

        // Effects
        const triggerExplosion = () => {
            DOM.particle.style.display = 'none';
            for (let i = 0; i < 15; i++) {
                const shrapnel = document.createElement('div');
                shrapnel.className = 'shrapnel';
                shrapnel.style.transform = `translate(${state.x}px, ${state.y}px)`;
                DOM.board.appendChild(shrapnel);
                state.shrapnelElements.push(shrapnel);

                // Animate outwards
                requestAnimationFrame(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 40 + Math.random() * 80;
                    const endX = state.x + Math.cos(angle) * distance;
                    const endY = state.y + Math.sin(angle) * distance;
                    shrapnel.style.transform = `translate(${endX}px, ${endY}px)`;
                    shrapnel.style.opacity = '0';
                });
            }
        };

        const clearExplosion = () => {
            state.shrapnelElements.forEach(el => el.remove());
            state.shrapnelElements = [];
            DOM.particle.style.display = 'block';
        };

        const gameLoop = () => {
            if (!state.isPlaying) return;

            state.x += state.vx;
            state.y += state.vy;
            const distFromCenter = Math.sqrt(state.x**2 + state.y**2);

            // Check Game Over
            if (distFromCenter > config.maxRadius) {
                gameOver();
                return;
            }

            // Apply position
            DOM.particle.style.transform = `translate(${state.x}px, ${state.y}px)`;

            // Check Center Glow
            const isCentered = distFromCenter < config.centerRadius;
            state.currentMultiplier = state.baseMultiplier * (isCentered ? 2 : 1);
            
            if (isCentered) {
                DOM.particle.classList.add('centered');
                DOM.uiMultiplier.classList.add('multiplier-glow');
            } else {
                DOM.particle.classList.remove('centered');
                DOM.uiMultiplier.classList.remove('multiplier-glow');
            }

            // Time & Score
            state.timeElapsed = Math.floor((Date.now() - state.startTime) / 1000);
            state.score += (state.currentMultiplier * 0.16); // Accumulate over frames (~60fps)

            // Update UI efficiently
            if (Math.floor(state.score) !== parseInt(DOM.uiScore.innerText.replace(/,/g, ''))) {
                DOM.uiScore.innerText = Math.floor(state.score).toLocaleString();
            }
            DOM.uiTime.innerText = state.timeElapsed;
            DOM.uiMultiplier.innerText = `x${state.currentMultiplier.toFixed(1)}`;

            state.animFrame = requestAnimationFrame(gameLoop);
        };

        const startCountdown = async () => {
            DOM.startScreen.classList.add('opacity-0');
            DOM.gameOverScreen.classList.add('hidden');
            setTimeout(() => {
                DOM.startScreen.classList.add('hidden');
                DOM.countdownScreen.classList.remove('hidden');
                DOM.gameUI.classList.remove('hidden');
                DOM.gameUI.classList.remove('opacity-0');
            }, 500);

            for (let i = 3; i > 0; i--) {
                DOM.countdownText.innerText = i;
                // Pop animation
                DOM.countdownText.style.transform = 'scale(1.2)';
                setTimeout(() => DOM.countdownText.style.transform = 'scale(1)', 200);
                await new Promise(r => setTimeout(r, 1000));
            }
            
            DOM.countdownScreen.classList.add('hidden');
            startGame();
        };

        const startGame = () => {
            clearExplosion();
            state = { ...state, isPlaying: true, score: 0, baseMultiplier: 1.0, currentMultiplier: 1.0, distanceWalked: 0, timeElapsed: 0, startTime: Date.now(), x: 0, y: 0, vx: 0, vy: 0, startLat: null, startLon: null };
            
            DOM.uiScore.innerText = '0';
            DOM.uiMultiplier.innerText = 'x1.0';
            DOM.uiDistance.innerText = '0.0';
            DOM.uiTime.innerText = '0';
            DOM.particle.classList.remove('centered');
            DOM.uiMultiplier.classList.remove('multiplier-glow');

            state.animFrame = requestAnimationFrame(gameLoop);
        };

        const gameOver = () => {
            state.isPlaying = false;
            cancelAnimationFrame(state.animFrame);
            triggerExplosion();

            const finalIntScore = Math.floor(state.score);
            DOM.finalScore.innerText = finalIntScore.toLocaleString();

            // Handle Highscore UI
            DOM.hsEntry.classList.add('hidden');
            DOM.savedMsg.classList.add('hidden');
            DOM.playerName.value = '';
            DOM.saveBtn.disabled = false;
            DOM.saveBtn.innerText = 'SAVE TO DEVICE';

            // Show input if it's better than current local best
            if (finalIntScore > localBestData.score) {
                DOM.hsEntry.classList.remove('hidden');
            }

            setTimeout(() => {
                DOM.gameUI.classList.add('opacity-0');
                setTimeout(() => {
                    DOM.gameUI.classList.add('hidden');
                    DOM.gameOverScreen.classList.remove('hidden');
                }, 1000);
            }, 1000); // Delay to watch explosion
        };

        // Local Storage Save Function
        DOM.saveBtn.addEventListener('click', () => {
            const name = DOM.playerName.value.trim().toUpperCase();
            if (name.length !== 3) return;
            
            const newBest = {
                name: name,
                score: Math.floor(state.score),
                timestamp: Date.now()
            };

            localStorage.setItem(LS_KEY, JSON.stringify(newBest));
            loadHighscore(); // Update UI
            
            DOM.hsEntry.classList.add('hidden');
            DOM.savedMsg.classList.remove('hidden');
        });

        // Permissions & Hardware Listeners
        const requestPermissions = async () => {
            try {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    const perm = await DeviceOrientationEvent.requestPermission();
                    if (perm !== 'granted') return alert('Tilt permission required.');
                }
                
                window.addEventListener('deviceorientation', handleOrientation);
                
                if ("geolocation" in navigator) {
                    if (state.geoWatchId) navigator.geolocation.clearWatch(state.geoWatchId);
                    state.geoWatchId = navigator.geolocation.watchPosition(
                        handlePosition, (err) => console.warn("GPS:", err.message),
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                }
                startCountdown();
            } catch (err) {
                console.error(err);
                alert('Sensor initialization failed. Please use a compatible mobile device.');
            }
        };

        DOM.startBtn.addEventListener('click', requestPermissions);
        DOM.restartBtn.addEventListener('click', startCountdown);

    </script>
</body>
</html>
